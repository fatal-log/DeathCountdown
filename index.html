<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>S Y S T E M :: F A T E</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Tajawal:wght@500;800;900&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
        }

        body {
            background-color: #030101;
            color: #b30000;
            font-family: 'Tajawal', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
            position: relative;
        }

        /* شاشة الضوضاء والحبيبات (Vignette & Noise Screen) */
        .scanline {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.4) 50%), 
                        radial-gradient(circle, rgba(130, 0, 0, 0.15) 0%, rgba(0, 0, 0, 0.95) 85%);
            background-size: 100% 4px, 100% 100%;
            z-index: 2;
            pointer-events: none;
        }

        /* خلفية الضباب الخافق */
        .ambient-pulse {
            position: fixed;
            width: 150vw;
            height: 150vh;
            background: radial-gradient(circle, rgba(150, 0, 0, 0.12) 0%, rgba(0, 0, 0, 1) 70%);
            animation: breathe 8s infinite alternate ease-in-out;
            z-index: 1;
        }

        @keyframes breathe {
            0% { transform: scale(1); opacity: 0.4; }
            100% { transform: scale(1.15); opacity: 0.8; }
        }

        /* الإطار الرئيسي */
        .container {
            position: relative;
            z-index: 3;
            width: 92%;
            max-width: 440px;
            padding: 40px 30px;
            border: 1px solid rgba(139, 0, 0, 0.4);
            box-shadow: 0 0 50px rgba(0, 0, 0, 0.95), 0 0 15px rgba(100, 0, 0, 0.2);
            background: rgba(4, 2, 2, 0.96);
            border-radius: 4px;
            text-align: center;
            backdrop-filter: blur(5px);
        }

        .sys-id {
            font-family: 'Share Tech Mono', monospace;
            font-size: 0.65rem;
            color: #4a0d0d;
            letter-spacing: 2px;
            margin-bottom: 15px;
            text-transform: uppercase;
        }

        h1 {
            font-family: 'Tajawal', sans-serif;
            font-weight: 900;
            font-size: 2.2rem;
            color: #d90429;
            letter-spacing: 2px;
            text-shadow: 0 0 8px rgba(217, 4, 41, 0.6);
            margin-bottom: 8px;
        }

        p.subtitle {
            color: #5a5a5a;
            font-size: 0.8rem;
            margin-bottom: 30px;
            letter-spacing: 0.5px;
        }

        .input-group {
            margin-bottom: 25px;
            text-align: right;
        }

        label {
            display: block;
            font-size: 0.75rem;
            color: #7a2828;
            margin-bottom: 8px;
            letter-spacing: 1px;
            font-family: 'Share Tech Mono', 'Tajawal';
        }

        input {
            width: 100%;
            padding: 14px 12px;
            background: #000000;
            border: 1px solid #330d0d;
            color: #e6e6e6;
            font-size: 1rem;
            border-radius: 2px;
            outline: none;
            text-align: center;
            transition: all 0.4s ease;
            font-family: 'Tajawal', sans-serif;
        }

        input:focus {
            border-color: #8b0000;
            box-shadow: 0 0 10px rgba(139, 0, 0, 0.5);
        }

        button {
            width: 100%;
            padding: 16px;
            background: #4a0000;
            color: #cccccc;
            border: 1px solid #660000;
            font-size: 0.95rem;
            font-weight: 800;
            letter-spacing: 1px;
            cursor: pointer;
            border-radius: 2px;
            transition: 0.3s;
        }

        button:hover {
            background: #800000;
            color: #ffffff;
            box-shadow: 0 0 20px rgba(128, 0, 0, 0.6);
        }

        /* شاشة التزامن والتحميل السوداوية */
        .loading-screen {
            display: none;
            padding: 20px 0;
        }

        .terminal-logs {
            font-family: 'Share Tech Mono', monospace;
            font-size: 0.7rem;
            color: #801a1a;
            text-align: left;
            direction: ltr;
            margin-top: 15px;
            line-height: 1.6;
            min-height: 60px;
        }

        /* شاشة العداد */
        .result-screen {
            display: none;
        }

        .victim-name {
            color: #ffffff;
            font-weight: 800;
            font-size: 1.2rem;
            border-bottom: 1px solid #4a0d0d;
            padding-bottom: 8px;
            display: inline-block;
        }

        .timer-grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 6px;
            margin: 30px 0 20px 0;
            background: #000000;
            padding: 18px 8px;
            border: 1px solid #2a0000;
        }

        .time-box {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .time-number {
            font-family: 'Share Tech Mono', monospace;
            font-size: 1.6rem;
            color: #d90429;
            text-shadow: 0 0 6px rgba(217, 4, 41, 0.5);
        }

        .time-label {
            font-size: 0.65rem;
            color: #444;
            margin-top: 6px;
        }

        .warning-footer {
            color: #3d3d3d;
            font-size: 0.7rem;
            margin-top: 20px;
            letter-spacing: 0.5px;
            line-height: 1.4;
        }

        .cheat-warning {
            color: #ff3333;
            font-size: 0.75rem;
            background: rgba(40, 0, 0, 0.6);
            border: 1px solid #660000;
            padding: 10px;
            margin-bottom: 20px;
            display: none;
            text-align: right;
            line-height: 1.5;
        }
    </style>
</head>
<body>

    <div class="scanline"></div>
    <div class="ambient-pulse"></div>

    <div class="container">
        <div class="sys-id">LOC_NODE :: <span id="node-id">FETCHING...</span></div>

        <!-- شاشة الإدخال -->
        <div id="form-screen">
            <h1>ســجّـل الفــنـاء</h1>
            <p class="subtitle">أدخل هويتك الكاملة لتحديد النقطة الزمنية المقدرة</p>
            
            <div id="cheatWarning" class="cheat-warning"></div>

            <div class="input-group">
                <label>> الاسم الكامل للمستهدف:</label>
                <input type="text" id="fullName" placeholder="الاسم هنا..." autocomplete="off" spellcheck="false">
            </div>

            <button onclick="processEntry()">بدء الحساب التنازلي</button>
        </div>

        <!-- شاشة التزامن العميقة -->
        <div id="loading-screen" class="loading-screen">
            <p style="color: #a00000; font-size: 0.85rem; letter-spacing: 1px;">جاري تحليل البصمة وتعيين الأجل...</p>
            <div class="terminal-logs" id="terminal-logs"></div>
        </div>

        <!-- شاشة العداد -->
        <div id="result-screen" class="result-screen">
            <p style="color: #5a5a5a; font-size: 0.75rem; margin-bottom: 5px;">تم قفل القيد على الكيان:</p>
            <div id="displayName" class="victim-name"></div>

            <div class="timer-grid">
                <div class="time-box">
                    <div id="years" class="time-number">00</div>
                    <div class="time-label">سنة</div>
                </div>
                <div class="time-box">
                    <div id="days" class="time-number">00</div>
                    <div class="time-label">يوم</div>
                </div>
                <div class="time-box">
                    <div id="hours" class="time-number">00</div>
                    <div class="time-label">ساعة</div>
                </div>
                <div class="time-box">
                    <div id="minutes" class="time-number">00</div>
                    <div class="time-label">دقيقة</div>
                </div>
                <div class="time-box">
                    <div id="seconds" class="time-number">00</div>
                    <div class="time-label">ثانية</div>
                </div>
            </div>

            <p class="warning-footer">تم تسجيل البصمة وتثبيتها محلياً.<br>البيانات المحددة لا يمكن تعديلها أو تجاوزها.</p>
        </div>
    </div>

    <script>
        // توليد معرف عشوائي خيالي للسيرفر في أعلى الشاشة
        document.getElementById('node-id').innerText = Math.random().toString(36).substring(2, 9).toUpperCase();

        window.onload = function() {
            // كشف الوضع الخفي / Incognito Mode
            const isIncognito = !window.indexedDB || navigator.webdriver;
            if (isIncognito) {
                const warningBox = document.getElementById('cheatWarning');
                warningBox.innerText = "[تنبيه النظام]: محاولة التخفي بالوضع الخفي لن تمحو السجل... البصمة الفيزيائية للجهاز مسجلة.";
                warningBox.style.display = 'block';
            }

            const registeredName = localStorage.getItem('sys_fate_victim');
            const registeredTime = localStorage.getItem('sys_fate_time');

            if (registeredName && registeredTime) {
                showResult(registeredName, parseInt(registeredTime));
            }
        };

        function processEntry() {
            const inputName = document.getElementById('fullName').value.trim();
            if (!inputName) {
                alert('يتطلب النظام إدخال الاسم كاملاً.');
                return;
            }

            const registeredName = localStorage.getItem('sys_fate_victim');
            const registeredTime = localStorage.getItem('sys_fate_time');

            // إذا حاول تغيير اسمه من نفس المتصفح
            if (registeredName) {
                const warningBox = document.getElementById('cheatWarning');
                warningBox.innerText = `[خطأ الوصول]: تم تثبيت السجل مسبقاً باسم (${registeredName}). لا يمكنك تغيير المقدر.`;
                warningBox.style.display = 'block';

                setTimeout(() => {
                    showResult(registeredName, parseInt(registeredTime));
                }, 2200);
                return;
            }

            // بدء التحميل وسرد السطور التفاعلية (Terminal Simulation)
            document.getElementById('form-screen').style.display = 'none';
            document.getElementById('loading-screen').style.display = 'block';

            const logs = [
                "> Extracting hardware attributes...",
                "> Locking CPU core frequency...",
                "> Analyzing biological variance...",
                "> Synchronizing temporal limit..."
            ];
            
            let logIndex = 0;
            const logContainer = document.getElementById('terminal-logs');
            
            const logInterval = setInterval(() => {
                if(logIndex < logs.length) {
                    logContainer.innerHTML += logs[logIndex] + "<br>";
                    logIndex++;
                } else {
                    clearInterval(logInterval);
                }
            }, 750);

            setTimeout(() => {
                const randomYears = Math.floor(Math.random() * 40) + 1;
                const randomDays = Math.floor(Math.random() * 365);
                const randomHours = Math.floor(Math.random() * 24);
                const randomMinutes = Math.floor(Math.random() * 60);

                const futureDate = new Date();
                futureDate.setFullYear(futureDate.getFullYear() + randomYears);
                futureDate.setDate(futureDate.getDate() + randomDays);
                futureDate.setHours(futureDate.getHours() + randomHours);
                futureDate.setMinutes(futureDate.getMinutes() + randomMinutes);

                const targetTimeStamp = futureDate.getTime();

                localStorage.setItem('sys_fate_victim', inputName);
                localStorage.setItem('sys_fate_time', targetTimeStamp);

                showResult(inputName, targetTimeStamp);
            }, 3600);
        }

        function showResult(name, targetTimeStamp) {
            document.getElementById('form-screen').style.display = 'none';
            document.getElementById('loading-screen').style.display = 'none';
            document.getElementById('result-screen').style.display = 'block';
            document.getElementById('displayName').innerText = name;

            startTimer(targetTimeStamp);
        }

        function startTimer(targetTimeStamp) {
            function update() {
                const now = new Date().getTime();
                const difference = targetTimeStamp - now;

                if (difference <= 0) {
                    clearInterval(interval);
                    return;
                }

                const years = Math.floor(difference / (1000 * 60 * 60 * 24 * 365));
                const days = Math.floor((difference % (1000 * 60 * 60 * 24 * 365)) / (1000 * 60 * 60 * 24));
                const hours = Math.floor((difference % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
                const minutes = Math.floor((difference % (1000 * 60 * 60)) / (1000 * 60));
                const seconds = Math.floor((difference % (1000 * 60)) / 1000);

                document.getElementById('years').innerText = String(years).padStart(2, '0');
                document.getElementById('days').innerText = String(days).padStart(2, '0');
                document.getElementById('hours').innerText = String(hours).padStart(2, '0');
                document.getElementById('minutes').innerText = String(minutes).padStart(2, '0');
                document.getElementById('seconds').innerText = String(seconds).padStart(2, '0');
            }

            update();
            const interval = setInterval(update, 1000);
        }
    </script>
</body>
</html>
